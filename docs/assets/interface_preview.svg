<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="cardSelected" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Monaco, monospace; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="880" height="720" rx="20" fill="#090D16" />
  <circle cx="200" cy="180" r="160" fill="#6366F1" fill-opacity="0.15" filter="blur(60px)" />
  <circle cx="680" cy="520" r="180" fill="#06B6D4" fill-opacity="0.12" filter="blur(70px)" />

  <!-- Main Floating Window -->
  <g transform="translate(180, 40)" filter="url(#panelShadow)">
    <!-- Liquid Glass Body -->
    <rect width="520" height="640" rx="18" fill="#161C2A" fill-opacity="0.88" />
    <rect width="520" height="640" rx="18" fill="none" stroke="url(#windowBorder)" stroke-width="1.2" />

    <!-- 1. Header -->
    <g transform="translate(20, 16)">
      <!-- Icon + Title -->
      <rect x="0" y="2" width="22" height="22" rx="6" fill="#3B82F6" />
      <path d="M 6 12 L 9 15 L 16 8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="30" y="19" class="font" font-weight="600" font-size="14" fill="#FFFFFF">Clipboard</text>
      <rect x="105" y="4" width="28" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.1" />
      <text x="114" y="17" class="font" font-weight="600" font-size="11" fill="#94A3B8">24</text>

      <!-- Active Queue Indicator -->
      <g transform="translate(145, 3)">
        <rect width="90" height="20" rx="10" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-opacity="0.3" stroke-width="0.8" />
        <circle cx="10" cy="10" r="3.5" fill="#10B981" />
        <text x="20" y="14" class="font" font-weight="600" font-size="10" fill="#34D399">Queue: 2/5</text>
      </g>

      <!-- Right Header Actions -->
      <g transform="translate(425, 6)">
        <circle cx="10" cy="8" r="10" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="6" y="12" class="font" font-size="11" fill="#94A3B8">⌕</text>
        <circle cx="34" cy="8" r="10" fill="#FFFFFF" fill-opacity="0.06" />
        <text x="30" y="12" class="font" font-size="11" fill="#94A3B8">⚙</text>
      </g>
    </g>

    <!-- 2. Search Field -->
    <g transform="translate(20, 52)">
      <rect width="480" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#windowBorder)" stroke-width="0.8" />
      <text x="14" y="22" class="font" font-size="14" fill="#64748B">🔍</text>
      <text x="36" y="22" class="font" font-size="12.5" fill="#94A3B8">Search text, links, code, or OCR in images…</text>
    </g>

    <!-- 3. Liquid Sliding Filter Tabs -->
    <g transform="translate(20, 96)">
      <rect width="480" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" />
      
      <!-- Selected Tab: All (Liquid Sliding Pill) -->
      <rect x="3" y="3" width="70" height="26" rx="13" fill="url(#accentPill)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="24" y="20" class="font" font-weight="600" font-size="11.5" fill="#FFFFFF">All</text>

      <!-- Tab: Text -->
      <text x="96" y="20" class="font" font-weight="500" font-size="11.5" fill="#94A3B8">Text</text>
      <!-- Tab: Images -->
      <text x="156" y="20" class="font" font-weight="500" font-size="11.5" fill="#94A3B8">Images</text>
      <!-- Tab: Links -->
      <text x="226" y="20" class="font" font-weight="500" font-size="11.5" fill="#94A3B8">Links</text>
      <!-- Tab: Code -->
      <text x="286" y="20" class="font" font-weight="500" font-size="11.5" fill="#94A3B8">Code</text>
      <!-- Tab: Pinned -->
      <text x="352" y="20" class="font" font-weight="500" font-size="11.5" fill="#94A3B8">Pinned</text>
    </g>

    <!-- 4. Card List -->
    <g transform="translate(20, 140)">
      
      <!-- Card 1: Selected (URL item) -->
      <g transform="translate(0, 0)">
        <rect width="480" height="74" rx="12" fill="url(#cardSelected)" stroke="#3B82F6" stroke-opacity="0.65" stroke-width="1.2" />
        <!-- Link Badge -->
        <rect x="12" y="10" width="130" height="20" rx="6" fill="#3B82F6" fill-opacity="0.2" />
        <text x="20" y="24" class="font" font-weight="600" font-size="10.5" fill="#60A5FA">🌐 github.com/apple</text>
        <text x="12" y="46" class="font" font-weight="500" font-size="12.5" fill="#FFFFFF">https://github.com/apple/swift</text>
        <!-- Meta -->
        <text x="12" y="63" class="font" font-size="10.5" fill="#94A3B8">Safari · Just now</text>
        <rect x="440" y="10" width="28" height="18" rx="5" fill="#FFFFFF" fill-opacity="0.08" />
        <text x="446" y="23" class="font" font-weight="600" font-size="10" fill="#CBD5E1">⌘1</text>
      </g>

      <!-- Card 2: Color Palette Swatch -->
      <g transform="translate(0, 82)">
        <rect width="480" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.8" />
        <circle cx="22" cy="24" r="9" fill="#6366F1" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
        <text x="38" y="28" class="mono" font-weight="700" font-size="12.5" fill="#A5B4FC">#6366F1</text>
        <text x="12" y="48" class="font" font-size="12" fill="#E2E8F0">Indigo accent for liquid glass specular rim</text>
        <text x="12" y="61" class="font" font-size="10" fill="#64748B">VS Code · 2m ago</text>
        <rect x="440" y="10" width="28" height="18" rx="5" fill="#FFFFFF" fill-opacity="0.08" />
        <text x="446" y="23" class="font" font-weight="600" font-size="10" fill="#CBD5E1">⌘2</text>
      </g>

      <!-- Card 3: Image with Vision OCR text -->
      <g transform="translate(0, 160)">
        <rect width="480" height="78" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.8" />
        <!-- Image Thumbnail Placeholder -->
        <rect x="12" y="10" width="58" height="58" rx="8" fill="#1E293B" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.8" />
        <text x="30" y="44" class="font" font-size="16" fill="#64748B">🖼️</text>
        <g transform="translate(80, 14)">
          <rect width="78" height="18" rx="5" fill="#3B82F6" fill-opacity="0.15" />
          <text x="8" y="13" class="font" font-weight="600" font-size="10" fill="#60A5FA">Text inside</text>
          <text x="0" y="34" class="font" font-size="12" fill="#E2E8F0">"Error: connection timeout to cluster-us-east"</text>
          <text x="0" y="50" class="font" font-size="10" fill="#64748B">Screenshot · 1280×720 · 5m ago</text>
        </g>
        <rect x="440" y="10" width="28" height="18" rx="5" fill="#FFFFFF" fill-opacity="0.08" />
        <text x="446" y="23" class="font" font-weight="600" font-size="10" fill="#CBD5E1">⌘3</text>
      </g>
    </g>

    <!-- 5. Quick Look Glass Drawer (Slide-up Overlay) -->
    <g transform="translate(16, 395)">
      <rect width="488" height="230" rx="16" fill="#0F172A" fill-opacity="0.96" stroke="url(#windowBorder)" stroke-width="1" />
      
      <!-- Drawer Header -->
      <g transform="translate(16, 16)">
        <text x="0" y="14" class="font" font-size="13" fill="#60A5FA">✨</text>
        <text x="20" y="14" class="font" font-weight="600" font-size="12.5" fill="#FFFFFF">Quick Look &amp; Smart Transformations</text>
        <rect x="250" y="2" width="105" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08" />
        <text x="260" y="14" class="font" font-size="10" fill="#94A3B8">3 words · 27 chars</text>
        <text x="445" y="14" class="font" font-size="13" fill="#64748B">✕</text>
      </g>

      <!-- Content Preview Box -->
      <g transform="translate(16, 42)">
        <rect width="456" height="58" rx="8" fill="#FFFFFF" fill-opacity="0.04" />
        <text x="12" y="26" class="mono" font-size="11.5" fill="#F8FAFC">https://github.com/apple/swift</text>
        <text x="12" y="44" class="font" font-size="10.5" fill="#38BDF8">↗ Open in Default Browser (⌘O)</text>
      </g>

      <!-- Horizontal Transformation Pills -->
      <g transform="translate(16, 114)">
        <rect x="0" y="0" width="70" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="10" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">Plain Text</text>

        <rect x="76" y="0" width="82" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="86" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">UPPERCASE</text>

        <rect x="164" y="0" width="72" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="174" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">Title Case</text>

        <rect x="242" y="0" width="76" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="252" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">camelCase</text>

        <rect x="324" y="0" width="74" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="334" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">snake_case</text>

        <rect x="404" y="0" width="50" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.8" />
        <text x="414" y="16" class="font" font-weight="500" font-size="10.5" fill="#E2E8F0">JSON</text>
      </g>

      <!-- Bottom Action Buttons -->
      <g transform="translate(16, 160)">
        <!-- Copy Button -->
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.8" />
        <text x="88" y="22" class="font" font-weight="600" font-size="12" fill="#E2E8F0">📋 Copy Only</text>

        <!-- Paste Button -->
        <rect x="236" y="0" width="220" height="34" rx="8" fill="url(#accentPill)" />
        <text x="306" y="22" class="font" font-weight="600" font-size="12" fill="#FFFFFF">↵ Paste into App</text>
      </g>
    </g>

  </g>
</svg>

