<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="meshPurple" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshCyan" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshBlue" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Specular Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 56px; fill: #FFFFFF; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-weight: 600; font-size: 13px; fill: #E2E8F0; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-weight: 500; font-size: 15px; fill: #38BDF8; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="24" fill="url(#meshPurple)" />
  <rect width="1200" height="420" rx="24" fill="url(#meshCyan)" />
  <rect width="1200" height="420" rx="24" fill="url(#meshBlue)" />
  <rect width="1200" height="420" rx="24" fill="none" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Left Side: App Icon Showcase -->
  <g transform="translate(80, 85)" filter="url(#glassShadow)">
    <!-- Squircle Icon Base -->
    <rect width="250" height="250" rx="55" fill="#181E2E" stroke="url(#glassBorder)" stroke-width="2" />
    
    <!-- Paper Sheet Back -->
    <rect x="35" y="45" width="180" height="175" rx="16" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Paper Sheet Front -->
    <rect x="45" y="32" width="160" height="185" rx="14" fill="#F8FAFC" />
    
    <!-- Lines on paper -->
    <rect x="65" y="65" width="80" height="10" rx="5" fill="#3B82F6" />
    <rect x="65" y="85" width="120" height="8" rx="4" fill="#CBD5E1" />
    <rect x="65" y="100" width="70" height="8" rx="4" fill="#CBD5E1" />
    
    <!-- Image Card in Paper -->
    <rect x="65" y="125" width="120" height="65" rx="10" fill="url(#accentGrad)" />
    <circle cx="155" cy="145" r="9" fill="#FDE047" fill-opacity="0.9" />
    <path d="M 65 175 L 105 145 L 135 165 L 160 148 L 185 175 Z" fill="#FFFFFF" fill-opacity="0.4" />
    <!-- OCR Scan Line -->
    <rect x="70" y="155" width="110" height="3" rx="1.5" fill="#34D399" />
    
    <!-- Metallic Clip -->
    <rect x="90" y="18" width="70" height="24" rx="8" fill="#E2E8F0" />
    <rect x="110" y="24" width="30" height="8" rx="4" fill="#94A3B8" />
  </g>

  <!-- Right Side: Hero Content -->
  <g transform="translate(380, 105)">
    <!-- Tagline Pill -->
    <rect width="260" height="32" rx="16" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="21" class="tagline">✨ Apple Liquid Glass Architecture</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title">ClipStack <tspan fill="url(#accentGrad)">for macOS</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="130" class="subtitle">The missing Windows 11 Clipboard + PowerToys Text Extractor,</text>
    <text x="0" y="160" class="subtitle">reimagined natively for macOS with Apple Vision on-device OCR.</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: Shortcut -->
      <g transform="translate(0, 0)">
        <rect width="110" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="18" y="22" class="badge-text">⌨️ ⌘⇧V / ⌥V</text>
      </g>
      <!-- Badge 2: Vision OCR -->
      <g transform="translate(122, 0)">
        <rect width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="16" y="22" class="badge-text">🔍 Apple Vision OCR</text>
      </g>
      <!-- Badge 3: Sequential Queue -->
      <g transform="translate(284, 0)">
        <rect width="165" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="16" y="22" class="badge-text">⚡ Sequential Paste</text>
      </g>
      <!-- Badge 4: Privacy Offline -->
      <g transform="translate(461, 0)">
        <rect width="145" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="16" y="22" class="badge-text">🔒 100% On-Device</text>
      </g>
    </g>
  </g>
</svg>

